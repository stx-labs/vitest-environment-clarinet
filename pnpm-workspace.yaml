# Supply-chain hardening on top of pnpm's defaults (exotic transitive sources
# and unreviewed build scripts are already blocked).
# See https://pnpm.io/supply-chain-security

# Only install versions published at least 7 days ago (in minutes).
# Setting it explicitly also makes it strict: resolution fails rather than
# falling back to a newer version.
minimumReleaseAge: 10080

# Fail if a package's trust evidence (trusted publisher, provenance) is weaker
# than for an earlier release.
trustPolicy: no-downgrade

# Refuse to install with an unsupported Node.js or pnpm version.
engineStrict: true

allowBuilds:
  # Pulled in by vitest 3 and 4 (tested in CI). Its postinstall only verifies
  # the platform binary, which works without it.
  esbuild: false
